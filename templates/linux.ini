# AutoBackup jobs for Linux. Read by autobackup.sh.
# `autobackup.sh --edit` copies this to ~/.config/autobackup/autobackup.ini and opens it.
# Full key reference: README.md -> "Config reference". Quotes are optional; comments go on their own line.
# rulegroups.ini, next to this file, has ready-made rules for some apps and folders: `rulegroup = NAME`.
# Paths: leading ~, {here} (the script folder) and {machine} are expanded. Run with --dry-run -v after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Dropbox        ~/Dropbox/AutoBackup
#   Nextcloud      ~/Nextcloud/AutoBackup
drive_root = ~/YOUR_SYNC_FOLDER/AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyLinux
# Defaults every job inherits unless it sets its own:
compress = zstd
compress_level = 3
every = 1d
# 1 = one archive per job, replaced on every change; the sync service's version history keeps
# older copies. If yours keeps none, use keep = 5 or so.
keep = 1
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = node_modules

# Plain-text app lists, copied as-is (apt-manual_MyLinux.txt, flatpak_MyLinux.tsv, ...).
[app-inventory]
dest = Config
pre = "{here}/hooks/inventory.sh" ~/.local/state/autobackup/inventory
source = ~/.local/state/autobackup/inventory
compress = copy

# Shell and tool config (including this one, in .config). Allow-listed with include lines so caches and secrets don't sneak in.
[dotfiles]
dest = Config
source = ~
include = .config
include = .gitconfig
include = .ssh/config
include = .zshrc
include = .bashrc
include = .profile
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# ---------------------------------------------------------------- examples
# Uncomment one and adjust it, or add jobs with --add.

# A projects folder. Inside git repos, .gitignore rules decide what's left out; the excludes
# cover folders that aren't repos.
# [projects]
# dest = Projects
# source = ~/Projects
# exclude = .venv
# exclude = __pycache__

# An Obsidian vault, keeping the 10 newest versions (for services without version history).
# [notes]
# dest = Documents/Notes
# source = ~/Documents/Notes
# rulegroup = notes.obsidian
# keep = 10

# One archive per Prism Launcher instance, weekly, in 2 GB parts. Restore by joining them (see README).
# [minecraft]
# dest = Games/Minecraft
# source = ~/.local/share/PrismLauncher/instances
# rulegroup = games.prism-instances
# chunk_size = 2G
