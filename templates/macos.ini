# AutoBackup jobs for macOS. Read by autobackup.sh.
# `autobackup.sh --edit` copies this to ~/.config/autobackup/autobackup.ini and opens it.
# Full key reference: README.md -> "Config reference". Quotes are optional; comments go on their own line.
# rulegroups.ini, next to this file, has ready-made rules for some apps and folders: `rulegroup = NAME`.
# Paths: leading ~, {here} (the script folder) and {machine} are expanded. Run with --dry-run -v after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Proton Drive   ~/Library/CloudStorage/ProtonDrive-you@proton.me-folder/AutoBackup
#   iCloud Drive   ~/Library/Mobile Documents/com~apple~CloudDocs/AutoBackup
#   Dropbox        ~/Library/CloudStorage/Dropbox/AutoBackup
#   Google Drive   ~/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive/AutoBackup
#   OneDrive       ~/Library/CloudStorage/OneDrive-Personal/AutoBackup
drive_root = ~/Library/CloudStorage/YOUR_SYNC_FOLDER/AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyMac
# Defaults every job inherits unless it sets its own:
compress = zstd
compress_level = 3
every = 1d
# 1 = one archive per job, replaced on every change; the sync service's version history keeps
# older copies. iCloud Drive has no version history for these files: use keep = 5 or so there.
keep = 1
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = .DS_Store
exclude = ._*
exclude = node_modules

# Plain-text app lists, copied as-is (Applications_MyMac.tsv, Brewfile_MyMac, ...).
[app-inventory]
dest = Config
pre = "{here}/hooks/inventory.sh" ~/.local/state/autobackup/inventory
source = ~/.local/state/autobackup/inventory
compress = copy

# Shell and tool config (including this one, in .config). .config is included whole, and some
# tools keep tokens there in plain text: list the archive with `tar -tf` and exclude what shouldn't
# leave this computer (README.md -> "Secrets and encryption").
[dotfiles]
dest = Config
source = ~
include = .config
include = .gitconfig
include = .ssh/config
include = .zshrc
include = .zprofile
include = .bash_profile
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# ---------------------------------------------------------------- examples
# Uncomment one and adjust it, or add jobs with --add.

# A projects folder. Inside git repos, .gitignore rules decide what's left out; the excludes
# cover folders that aren't repos.
# [projects]
# dest = Projects
# source = ~/Projects
# exclude = .venv
# exclude = __pycache__

# An Obsidian vault, keeping the 10 newest versions (for services without version history).
# [notes]
# dest = Documents/Notes
# source = ~/Documents/Notes
# rulegroup = notes.obsidian
# keep = 10

# One archive per Prism Launcher instance, weekly, in 2 GB parts. Restore by joining them (see README).
# [minecraft]
# dest = Games/Minecraft
# source = ~/Library/Application Support/PrismLauncher/instances
# rulegroup = games.prism-instances
# chunk_size = 2G
