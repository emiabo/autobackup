# AutoBackup jobs for macOS. Read by mac-backup.sh and mac-backup.fish.
# Copy this file to mac.conf next to the scripts, then edit it. mac.conf is git-ignored.
# Full key reference: README.md -> "Config reference". Values are literal (no quoting needed).
# Paths: leading ~, {here} (the script folder) and {machine} are expanded. Run with --dry-run -v after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Proton Drive   ~/Library/CloudStorage/ProtonDrive-you@proton.me-folder/AutoBackup
#   iCloud Drive   ~/Library/Mobile Documents/com~apple~CloudDocs/AutoBackup
#   Dropbox        ~/Library/CloudStorage/Dropbox/AutoBackup
#   Google Drive   ~/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive/AutoBackup
#   OneDrive       ~/Library/CloudStorage/OneDrive-Personal/AutoBackup
drive_root = ~/Library/CloudStorage/YOUR_SYNC_FOLDER/AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyMac
# Defaults every job inherits unless it sets its own:
compress = zstd
level = 3
every = 1d
skip_unchanged = true
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = .DS_Store
exclude = ._*
exclude = node_modules

# Plain-text app lists, copied as-is (Applications_MyMac.tsv, Brewfile_MyMac, ...).
[app-inventory]
dest = Config
pre = "{here}/hooks/mac-inventory.sh" ~/.local/state/autobackup/inventory
root = ~/.local/state/autobackup/inventory
compress = copy

# Shell and tool config. Allow-listed with include lines so caches and secrets don't sneak in.
[dotfiles]
dest = Config
root = ~
include = .config
include = .gitconfig
include = .ssh/config
include = .zshrc
include = .zprofile
include = .bash_profile
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# Projects and scripts. Build output and dependency folders are rebuildable, so they're left out.
[code]
enabled = false
dest = Code
root = ~/Code
exclude = .venv
exclude = venv
exclude = __pycache__
exclude = target
exclude = .next
exclude = dist
exclude = .build
exclude = DerivedData

# An Obsidian vault (or any notes folder).
[obsidian]
enabled = false
dest = Documents/Obsidian
root = ~/Documents/Obsidian/YOUR_VAULT
exclude = .obsidian/workspace.json
exclude = .obsidian/workspace-mobile.json
exclude = .trash
