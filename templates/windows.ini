# AutoBackup jobs for Windows. Read by AutoBackup.ps1. Keep this file ASCII-only.
# `AutoBackup.ps1 -Edit` copies this to %APPDATA%\AutoBackup\autobackup.ini and opens it.
# Full key reference: README.md -> "Config reference". Quotes are optional; comments go on their own line.
# rulegroups.ini, next to this file, has ready-made rules for some apps and folders: `rulegroup = NAME`.
# Paths: leading ~, %ENVVARS%, {here} (the script folder) and {machine} are expanded; / and \ both work.
# Exclude patterns always use forward slashes. Run with -DryRun -Verbose after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Proton Drive   %USERPROFILE%\Proton Drive\YOUR_ACCOUNT\My files\AutoBackup
#   iCloud Drive   %USERPROFILE%\iCloudDrive\AutoBackup
#   Dropbox        %USERPROFILE%\Dropbox\AutoBackup
#   Google Drive   G:\My Drive\AutoBackup
#   OneDrive       %OneDrive%\AutoBackup
# If drive_root is on another drive letter than C:, also set staging to a folder on that drive.
drive_root = %USERPROFILE%\YOUR_SYNC_FOLDER\AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyPC
# Defaults every job inherits unless it sets its own:
compress = zstd
compress_level = 3
every = 1d
# 1 = one archive per job, replaced on every change; the sync service's version history keeps
# older copies. iCloud Drive has no version history for these files: use keep = 5 or so there.
keep = 1
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = desktop.ini
exclude = Thumbs.db
exclude = node_modules

# Plain-text app lists, copied as-is (installed_MyPC.csv, winget_MyPC.json, ...).
[app-inventory]
dest = Config
pre = & "{here}\hooks\Inventory.ps1" "%LOCALAPPDATA%\AutoBackup\inventory"
source = %LOCALAPPDATA%\AutoBackup\inventory
compress = copy

# Shell and terminal settings, plus this config. If OneDrive redirects Documents, the PowerShell
# profile folders live under OneDrive\Documents instead.
# .config is included whole, and some tools keep tokens there in plain text: list the archive with
# `tar -tf` and exclude what shouldn't leave this computer (README.md -> "Secrets and encryption").
[dotfiles]
dest = Config
source = ~
include = .gitconfig
include = .config
include = .ssh/config
include = Documents/PowerShell
include = Documents/WindowsPowerShell
include = AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json
include = AppData/Roaming/AutoBackup
exclude = Documents/PowerShell/Modules
exclude = Documents/WindowsPowerShell/Modules
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# ---------------------------------------------------------------- examples
# Uncomment one and adjust it, or add jobs with -Add.

# A projects folder. Inside git repos, .gitignore rules decide what's left out; the excludes
# cover folders that aren't repos.
# [projects]
# dest = Projects
# source = ~/Projects
# exclude = .venv
# exclude = __pycache__

# An Obsidian vault, keeping the 10 newest versions (for services without version history).
# [notes]
# dest = Documents/Notes
# source = ~/Documents/Notes
# rulegroup = notes.obsidian
# keep = 10

# One archive per Prism Launcher instance, weekly, in 2 GB parts. Restore by joining them (see README).
# [minecraft]
# dest = Games/Minecraft
# source = %APPDATA%\PrismLauncher\instances
# rulegroup = games.prism-instances
# chunk_size = 2G
