# AutoBackup jobs for Linux. Read by autobackup.sh.
# `autobackup.sh --edit` copies this to ~/.config/autobackup/autobackup.conf and opens it.
# Full key reference: README.md -> "Config reference". Values are literal (no quoting needed).
# Paths: leading ~, {here} (the script folder) and {machine} are expanded. Run with --dry-run -v after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Dropbox        ~/Dropbox/AutoBackup
#   Nextcloud      ~/Nextcloud/AutoBackup
drive_root = ~/YOUR_SYNC_FOLDER/AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyLinux
# Defaults every job inherits unless it sets its own:
compress = zstd
level = 3
every = 1d
skip_unchanged = true
# 1 = one archive per job, replaced on every change; the sync service's version history keeps
# older copies. If yours keeps none, use keep = 5 or so.
keep = 1
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = node_modules

# Plain-text app lists, copied as-is (apt-manual_MyLinux.txt, flatpak_MyLinux.tsv, ...).
[app-inventory]
dest = Config
pre = "{here}/hooks/inventory.sh" ~/.local/state/autobackup/inventory
root = ~/.local/state/autobackup/inventory
compress = copy

# Shell and tool config (including this one, in .config). Allow-listed with include lines so caches and secrets don't sneak in.
[dotfiles]
dest = Config
root = ~
include = .config
include = .gitconfig
include = .ssh/config
include = .zshrc
include = .bashrc
include = .profile
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# Projects and scripts. Inside git repos, .gitignore rules decide what's left out; the
# excludes cover folders that aren't repos.
[code]
enabled = false
dest = Code
root = ~/Code
exclude = .venv
exclude = __pycache__

# An Obsidian vault (or any notes folder).
[obsidian]
enabled = false
dest = Documents/Obsidian
root = ~/Documents/Obsidian/YOUR_VAULT
exclude = .obsidian/workspace.json
exclude = .obsidian/workspace-mobile.json
exclude = .trash
