# AutoBackup jobs for Windows. Read by win-backup.ps1. Keep this file ASCII-only.
# Copy this file to win.conf next to the script, then edit it. win.conf is git-ignored.
# Full key reference: README.md -> "Config reference". Values are literal (no quoting needed).
# Paths: leading ~, %ENVVARS%, {here} (the script folder) and {machine} are expanded; / and \ both work.
# Exclude patterns always use forward slashes. Run with -DryRun -Verbose after edits.

[global]
# A folder inside your cloud sync folder. Its parent must exist. Typical locations:
#   Proton Drive   %USERPROFILE%\Proton Drive\YOUR_ACCOUNT\My files\AutoBackup
#   iCloud Drive   %USERPROFILE%\iCloudDrive\AutoBackup
#   Dropbox        %USERPROFILE%\Dropbox\AutoBackup
#   Google Drive   G:\My Drive\AutoBackup
#   OneDrive       %OneDrive%\AutoBackup
# If drive_root is on another drive letter than C:, also set staging to a folder on that drive.
drive_root = %USERPROFILE%\YOUR_SYNC_FOLDER\AutoBackup
# Suffix for every archive name, so several machines can share one drive_root.
machine = MyPC
# Defaults every job inherits unless it sets its own:
compress = zstd
level = 3
every = 1d
skip_unchanged = true
# Global excludes apply to every job. No slash = matches that name at any depth.
exclude = desktop.ini
exclude = Thumbs.db
exclude = node_modules

# Plain-text app lists, copied as-is (installed_MyPC.csv, winget_MyPC.json, ...).
[app-inventory]
dest = Config
pre = & "{here}\hooks\win-inventory.ps1" "%LOCALAPPDATA%\AutoBackup\inventory"
root = %LOCALAPPDATA%\AutoBackup\inventory
compress = copy

# Shell and terminal settings. If OneDrive redirects Documents, the PowerShell
# profile folders live under OneDrive\Documents instead.
[dotfiles]
dest = Config
root = ~
include = .gitconfig
include = .config
include = .ssh/config
include = Documents/PowerShell
include = Documents/WindowsPowerShell
include = AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json
exclude = Documents/PowerShell/Modules
exclude = Documents/WindowsPowerShell/Modules
exclude = *.sqlite
exclude = *.sqlite-*
exclude = *.db
exclude = cache
exclude = Cache
exclude = .cache

# Projects and scripts. Build output and dependency folders are rebuildable, so they're left out.
[code]
enabled = false
dest = Code
root = ~/Code
exclude = .venv
exclude = __pycache__
exclude = target
exclude = dist

# One archive per Prism Launcher instance. Shared libraries, assets and Java live outside
# instances\ and re-download from the versions pinned in each instance.
[minecraft]
enabled = false
dest = Games/Minecraft
root = %APPDATA%\PrismLauncher\instances
split = true
every = 7d
level = 1
skip_if_running = javaw
exclude = _LAUNCHER_TEMP
exclude = *minecraft/logs
exclude = *minecraft/crash-reports
exclude = *minecraft/.fabric
exclude = *minecraft/.mixin.out
