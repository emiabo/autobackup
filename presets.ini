# Presets: known folders, with what to keep and what to leave out. Read by both scripts.
# A job uses them with `preset = NAME` (or `preset = a, b` for several). Keys the job sets itself
# win over the preset's; include and exclude lines add up.
#
# Presets with include lines set root = ~, and their includes are paths inside your home folder,
# so their archives extract back into ~. Missing includes are skipped, so a preset can list every
# variant of a file. `--add` suggests these presets when you enter one of their folders.
# Presets without includes (obsidian, prism-instances) work under any root.
#
# Include lists name what to keep rather than excluding what to drop, for two reasons: the
# unchanged check only looks at included paths (state files that change all day don't trigger
# a rebuild), and exclude patterns can't be anchored, so `cache` would also drop same-named
# folders inside skills.

# ---------------------------------------------------------------- coding agents

# Shared agent skills (~/.claude/skills is often a symlink into here).
[agents]
root = ~
include = .agents

# Claude Code: instructions, settings, custom agents/commands/skills, hooks, installed plugin list.
# Left out: projects (transcripts), sessions, file-history, shell-snapshots, backups, cache,
# history.jsonl, plugin caches and marketplace clones (re-downloaded), ~/.claude.json (mostly state).
# Per-project memory sits in projects/<path>/memory next to transcripts, so it's left out too.
[claude]
root = ~
include = .claude/CLAUDE.md
include = .claude/settings.json
include = .claude/keybindings.json
include = .claude/agents
include = .claude/commands
include = .claude/skills
include = .claude/output-styles
include = .claude/hooks
include = .claude/rules
include = .claude/plugins/installed_plugins.json
include = .claude/plugins/known_marketplaces.json

# Codex: config, instructions, custom agents, rules, prompts, skills, memories.
# Left out: auth.json (login token), sessions and archived_sessions, *.sqlite state and logs,
# plugins (reinstallable), cache, .tmp, computer-use, generated_images, .chatgpt-projects.
[codex]
root = ~
include = .codex/config.toml
include = .codex/AGENTS.md
include = .codex/agents
include = .codex/rules
include = .codex/prompts
include = .codex/skills
include = .codex/memories
# Bundled with Codex.
exclude = .codex/skills/.system

# ---------------------------------------------------------------- notes

# An Obsidian vault, or a folder of vaults with per_subfolder = true.
[obsidian]
exclude = .obsidian/workspace.json
exclude = .obsidian/workspace-mobile.json
exclude = .trash

# ---------------------------------------------------------------- macOS apps
# Most Mac apps keep their settings in ~/Library/Preferences/*.plist, not Application Support.

# Alfred preferences and workflow settings. Left out: clipboard history, usage data.
[alfred]
root = ~
include = Library/Application Support/Alfred/Alfred.alfredpreferences
include = Library/Application Support/Alfred/Workflow Data
include = Library/Preferences/com.runningwithcrayons.Alfred.plist
include = Library/Preferences/com.runningwithcrayons.Alfred-Preferences.plist

[audio-hijack]
root = ~
include = Library/Application Support/Audio Hijack 4
include = Library/Preferences/com.rogueamoeba.audiohijack.plist

# Application Support holds only the license files.
[lasso]
root = ~
include = Library/Application Support/Lasso
include = Library/Preferences/com.heavylightapps.lasso.plist
include = Library/Preferences/com.heavylightapps.lasso-setapp.plist

[transmission]
root = ~
include = Library/Application Support/Transmission
include = Library/Preferences/org.m0k.transmission.plist
exclude = Transmission/blocklists
exclude = Transmission/dht.dat

# Settings and license. Left out: sensor history, and the helper apps in "iStat Menus 7".
[istat-menus]
root = ~
include = Library/Application Support/iStat Menus
include = Library/Preferences/com.bjango.istatmenus.plist
include = Library/Preferences/com.bjango.istatmenus.agent.plist
include = Library/Preferences/com.bjango.istatmenus.menubar.7.plist
include = Library/Preferences/com.bjango.istatmenus.status.plist
include = Library/Preferences/com.bjango.istatmenus-setapp.plist
include = Library/Preferences/com.bjango.istatmenus-setapp.agent.plist
include = Library/Preferences/com.bjango.istatmenus-setapp.menubar.7.plist
include = Library/Preferences/com.bjango.istatmenus-setapp.status.plist
exclude = iStat Menus/databases

# Renoise user library, license and app preferences (key bindings, Config.xml).
# Left out: Installed Libraries (downloadable packs), plugin scan caches.
[renoise]
root = ~
include = Documents/Renoise/User Library
include = Documents/Renoise/Renoise.license
include = Library/Preferences/Renoise
exclude = Cached*.db
exclude = CrashBackups
every = 7d

# Helium browser profile without caches. Works for any Chromium browser: copy this section and
# change the include. Cookies and saved passwords are left out; they're encrypted with a key in
# this Mac's Keychain and wouldn't open on another Mac anyway. Runs only while Helium is closed.
[helium]
root = ~
include = Library/Application Support/net.imput.helium
exclude = Service Worker/CacheStorage
exclude = Service Worker/ScriptCache
exclude = GPUCache
exclude = DawnWebGPUCache
exclude = DawnGraphiteCache
exclude = GraphiteDawnCache
exclude = component_crx_cache
exclude = Crashpad
exclude = CertificateRevocation
exclude = Cookies*
exclude = Login Data*
skip_if_running = Helium
every = 7d

# ---------------------------------------------------------------- games

# Prism Launcher's instances folder: one archive per instance. Shared libraries, assets and Java
# live outside instances/ and re-download from the versions each instance pins.
[prism-instances]
per_subfolder = true
every = 7d
level = 1
skip_if_running = javaw, java
exclude = _LAUNCHER_TEMP
exclude = *minecraft/logs
exclude = *minecraft/crash-reports
exclude = *minecraft/.fabric
exclude = *minecraft/.mixin.out
exclude = DistantHorizons.sqlite*
exclude = Distant_Horizons_server_data
